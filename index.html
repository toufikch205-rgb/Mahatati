html[lang="fr"] body,html[lang="fr"] .phone{direction:ltr}
html[lang="fr"] .place-row,html[lang="fr"] .ride-type,html[lang="fr"] .service{text-align:left}
html[lang="fr"] .car-art{height:64px;margin-bottom:4px}
.car-art svg{display:block;width:100%;max-width:145px;height:62px;overflow:visible;filter:drop-shadow(0 7px 5px #0008)}
.map-car{width:49px;height:28px;font-size:0;filter:drop-shadow(0 3px 3px #0008)}
.map-car svg{width:100%;height:100%;display:block}
html[lang="fr"] .form-head,html[lang="fr"] .form{text-align:left}

/* Mobile layout: keep the map within roughly the upper half of the screen */
.dark-map{height: min(36vh, 320px)!important; min-height: 250px;}
@media (max-height: 700px){.dark-map{height: 250px!important;min-height:230px;}}
@media (min-width: 600px){.dark-map{height: 320px!important;min-height:280px;}}

/* Real interactive map (Leaflet + OpenStreetMap) */
.dark-map{background:#0c121b!important;background-image:none!important;isolation:isolate}
.dark-map:before,.dark-map:after{display:none!important}
#realMap{position:absolute;inset:0;z-index:0;background:#101720}
#realMap .leaflet-tile{filter:brightness(.72) saturate(.72) hue-rotate(165deg)}
#realMap .leaflet-control-attribution{font-size:9px;background:#080c12cc;color:#aab5c3}
#realMap .leaflet-control-attribution a{color:#c6ff00}
#realMap .leaflet-control-zoom a{background:#101720;color:#c6ff00;border-color:#2a3543}
#realMap .leaflet-control-zoom{border:1px solid #2a3543!important;overflow:hidden;border-radius:10px}
.map-search,.quick-places,.dark-locate{z-index:500}
.map-search{pointer-events:auto}
.leaflet-marker-icon{filter:drop-shadow(0 3px 6px #0008)}
.map-status{position:absolute;z-index:500;left:15px;right:15px;bottom:72px;text-align:center;pointer-events:none}
.map-status span{display:inline-block;background:#0b1119e8;border:1px solid #2c3948;color:#dce5ef;padding:7px 11px;border-radius:20px;font-size:11px}


/* Compact welcome bar: free more vertical space for the map and vehicle cards */
.home-top{
  height:64px !important;
  min-height:64px !important;
  box-sizing:border-box;
  padding:7px 14px !important;
  gap:10px !important;
}
.home-top .menu-btn,
.home-top .notify-btn{
  width:38px !important;
  height:38px !important;
  min-width:38px !important;
  flex:0 0 38px;
  font-size:20px !important;
}
.home-top .greeting{
  min-width:0;
  gap:1px !important;
  line-height:1.15;
}
.home-top .greeting small{
  font-size:10px !important;
  line-height:1.1;
}
.home-top .greeting strong{
  font-size:14px !important;
  line-height:1.2;
  display:block;
  white-space:normal;
  overflow-wrap:anywhere;
}
@media (max-width:360px){
  .home-top{padding:6px 10px !important;gap:7px !important}
  .home-top .greeting strong{font-size:12px !important}
  .home-top .greeting small{font-size:9px !important}
}


/* Reference-inspired map-first layout: map occupies the upper part of the phone;
   greeting and its two action buttons float above the map. */
#home{position:relative}
#home .dark-map{
  height:min(53vh,440px)!important;
  min-height:340px!important;
  margin-top:0!important;
}
#home .home-top{
  position:absolute!important;
  top:0!important;left:0!important;right:0!important;
  z-index:700!important;
  height:88px!important;min-height:88px!important;
  padding:18px 18px 8px!important;
  background:linear-gradient(180deg,rgba(7,12,18,.94),rgba(7,12,18,.68),transparent)!important;
  border:0!important;
}
#home .home-top .menu-btn,
#home .home-top .notify-btn{
  width:46px!important;height:46px!important;min-width:46px!important;
  flex:0 0 46px!important;border-radius:17px!important;
  background:rgba(13,20,30,.9)!important;
  border:1px solid #2a3543!important;
  color:#f1f5f9!important;
  box-shadow:0 3px 12px #0005!important;
}
#home .home-top .greeting{color:#f4f7fb!important}
#home .home-top .greeting small{font-size:12px!important}
#home .home-top .greeting strong{font-size:15px!important;white-space:nowrap!important}
#home .map-search{top:98px!important;left:16px!important;right:16px!important}
#home .quick-places{display:none!important}
#home .dark-locate{bottom:18px!important;left:18px!important;z-index:650!important}
#home .dark-map .leaflet-control-zoom{margin-bottom:18px!important;margin-right:16px!important}
#home .map-status{bottom:72px!important}
@media(max-height:700px){
  #home .dark-map{height:350px!important;min-height:320px!important}
  #home .home-top{height:80px!important;min-height:80px!important;padding-top:12px!important}
  #home .map-search{top:88px!important}
  #home .quick-places{display:none!important}
}


/* Glass location inputs + luminous circular location indicators */
.map-search{background:rgba(14,20,29,.82)!important;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1)!important;border-radius:20px!important;box-shadow:0 12px 30px rgba(0,0,0,.28)!important}
.place-row{height:54px!important;font-size:14px!important;color:#f5f7fb!important}
.place-row span{color:#edf2f8!important;font-weight:500}
.place-row .dot{width:11px;height:11px;flex:0 0 11px;border-radius:50%;border:2px solid rgba(255,255,255,.55);box-sizing:content-box}
.place-row .green-dot{background:#8ef000;box-shadow:0 0 8px #8ef000,0 0 18px #8ef00070;border-color:#d8ff9a}
.place-row .red-dot{background:#ff465e;box-shadow:0 0 8px #ff465e,0 0 18px #ff465e70;border-color:#ffb0ba}
.place-row b{color:#dbe3ed!important}
.place-row .plus{background:#05080d!important;color:#fff!important;border:1px solid rgba(255,255,255,.08)}
.quick-places{display:none!important}.map-status{display:none!important}
.ride-picker-head{color:#fff!important;font-size:16px!important}
.ride-types{gap:10px!important}
.ride-type{position:relative;overflow:hidden;min-height:142px!important;border:1px solid rgba(255,255,255,.09)!important;border-radius:20px!important;background:linear-gradient(155deg,#151a22 0%,#0d1118 100%)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 10px 24px rgba(0,0,0,.22)!important;transition:border-color .2s,box-shadow .2s,transform .2s!important}
.ride-type:active{transform:scale(.98)}
.ride-type.selected{border:1.5px solid #8ef000!important;box-shadow:0 0 0 1px rgba(142,240,0,.35),0 0 16px rgba(142,240,0,.22),inset 0 0 18px rgba(142,240,0,.07)!important;background:linear-gradient(155deg,#171e18 0%,#0d1310 100%)!important}
.ride-type b{color:#fff!important;font-size:14px!important;font-weight:750!important}
.ride-type small{color:#bdc6d2!important;font-size:12px!important}
.car-art{height:64px!important;margin-bottom:7px!important}
.car-art svg{max-width:155px!important;height:66px!important;filter:drop-shadow(0 8px 7px #000b)!important}


.language-options{display:flex;gap:10px;margin-top:10px}.language-options button{flex:1;padding:12px 10px;border:1px solid #344152;border-radius:12px;background:#151e29;color:#f5f7fb;font-weight:750;cursor:pointer}.language-options button.active{border-color:#c6ff00;background:#c6ff0018;color:#c6ff00}html[dir="rtl"] body{text-align:right}html[dir="rtl"] .account-head,html[dir="rtl"] .account-hero,html[dir="rtl"] .notification-row,html[dir="rtl"] .menu-profile,html[dir="rtl"] .inputwrap{direction:rtl}html[dir="rtl"] .account-head,html[dir="rtl"] .notifications-head{flex-direction:row-reverse}html[dir="rtl"] .account-hero,html[dir="rtl"] .notification-row{ text-align:right}html[dir="rtl"] .menu-arrow{transform:scaleX(-1)}html[dir="rtl"] .form-head .back{transform:scaleX(-1)}
